<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROGACTS V4 Review</title></head>
<body style="margin:0;background:#ece9df;font-family:Arial,sans-serif"><div id="boot" style="padding:24px;color:#202824">Loading PROGACTS…</div>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/Mbatman9972/alwafer-link-hub/progacts-review/progacts-redo-v4/';
  const files=['payload-1.txt','payload-2.txt','payload-3.txt'];
  const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f+'?v=20260911-2');if(!r.ok)throw new Error('Failed to load '+f+' ('+r.status+')');return (await r.text()).trim();}));
  const p=parts.join('').replace(/\s+/g,'');
  if(p.length%4!==0)throw new Error('Payload length invalid: '+p.length);
  const bin=atob(p);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support gzip decompression. Please use current Chrome, Edge or Safari.');
  const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(ds).text();
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('boot').innerHTML='<b>PROGACTS could not start.</b><br><br>'+String(e);console.error(e);});
</script></body></html>
